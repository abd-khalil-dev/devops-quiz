name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Run tests
        run: pytest backend -q
      - name: Lint Helm chart
        run: helm lint helm/quiz

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Start the stack
        run: docker compose up -d
      - name: Smoke test through nginx
        run: |
          for i in $(seq 1 15); do
            curl -fs http://localhost:8080/api/health && break
            sleep 2
          done
          curl -fs http://localhost:8080/api/health
          curl -fs http://localhost:8080/api/categories
          curl -fs http://localhost:8080/ | grep -q "DevOps Interview Quiz"
          curl -fs http://localhost:8080/api/leaderboard
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/devops-quiz-${{ matrix.service }}
          tags: |
            type=sha
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1
      - name: Find the server
        id: server
        run: |
          IID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=quiz-server" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)
          if [ -z "$IID" ] || [ "$IID" = "None" ]; then
            echo "No running server found"
            exit 1
          fi
          echo "iid=$IID" >> "$GITHUB_OUTPUT"
      - name: Wait for SSM agent
        env:
          IID: ${{ steps.server.outputs.iid }}
        run: |
          for i in $(seq 1 40); do
            PING=$(aws ssm describe-instance-information --filters "Key=InstanceIds,Values=$IID" --query "InstanceInformationList[0].PingStatus" --output text 2>/dev/null || true)
            echo "attempt $i: SSM status = ${PING:-none}"
            [ "$PING" = "Online" ] && exit 0
            sleep 10
          done
          echo "Server is not managed by SSM yet"
          exit 1
      - name: Deploy with Helm over SSM
        env:
          IID: ${{ steps.server.outputs.iid }}
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          SCRIPT="set -e
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          sudo -u ubuntu git -C /home/ubuntu/devops-quiz pull --ff-only
          helm upgrade quiz /home/ubuntu/devops-quiz/helm/quiz -n quiz --reset-then-reuse-values --set backend.image.tag=$TAG --set frontend.image.tag=$TAG --set backend.appVersion=$TAG --wait --timeout 5m
          kubectl get pods -n quiz"
          CMD=$(aws ssm send-command \
            --instance-ids "$IID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy $TAG" \
            --parameters "$(jq -n --arg c "$SCRIPT" '{commands:[$c]}')" \
            --query "Command.CommandId" --output text)
          echo "Command: $CMD"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$IID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 6
          done
          aws ssm get-command-invocation --command-id "$CMD" --instance-id "$IID" --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$CMD" --instance-id "$IID" --query StandardErrorContent --output text
          echo "Final status: $STATUS"
          [ "$STATUS" = "Success" ]

apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: quiz
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: ghcr.io/abd-khalil-dev/devops-quiz-frontend:latest
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 5
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            memory: 96Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: quiz
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80

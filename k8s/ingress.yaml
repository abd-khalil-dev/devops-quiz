apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quiz
  namespace: quiz
spec:
  ingressClassName: nginx
  rules:
  - host: quiz.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
